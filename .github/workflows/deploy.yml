
name: Build and deploy Claude Unlimited

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "::error::Missing VITE_SUPABASE_URL"
            exit 1
          }

          test -n "$VITE_SUPABASE_ANON_KEY" || {
            echo "::error::Missing VITE_SUPABASE_ANON_KEY"
            exit 1
          }

          test -n "$VITE_API_URL" || {
            echo "::error::Missing VITE_API_URL"
            exit 1
          }

          echo "Frontend variables verified."

      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify build output
        run: |
          test -f dist/index.html || {
            echo "::error::dist/index.html was not generated"
            exit 1
          }

          echo "Build output verified."
          ls -la dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
